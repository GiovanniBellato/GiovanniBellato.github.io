<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <title>portfolio</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> 

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
	
	<style type="text/tailwindcss">
    @theme {
        --font-sans: "Inter", "Segoe UI", system-ui, sans-serif;
        --font-display: "Plus Jakarta Sans", "Georgia", sans-serif;

        --color-page: #FAFAFA;
        --color-ink: #0f172a;
        --color-muted: #797a7a;

		
    }

	html, body {
        overscroll-behavior-x: none;
    }

	
	</style>

</head>
<body class="h-screen overflow-hidden bg-page font-sans text-ink antialiased overscroll-x-none">
	<div id="app" class="flex flex-col h-full">
		<section class="flex p-5 shrink-0">
			
			<!-- header -->
			<header class="w-1/2">
				<h1 class="font-display text-lg tracking-tight">
					<router-link to="/">
						<span class="font-display align-middle">Portfolio |</span> <span class="text-muted font-display align-middle">Giovanni Bellato</span> 
					</router-link>
				</h1>
			</header>

			<!-- navigator -->
			<nav class="flex w-1/2 justify-end items-center">
				<router-link to="/"><h2 class="px-2 text-sm tracking-wide uppercase">Home</h2></router-link>
				<router-link to="/gallery"><h2 class="px-2 text-sm tracking-wide uppercase">Gallery</h2></router-link>
			</nav>

		</section>

		<main class="flex-1 min-h-0 overflow-y-auto">
			<router-view></router-view>

			</div>
			<p class="font-display mt-8 text-xs text-muted text-center">
				© 2026 Developed and Designed by Giovanni Bellato

			</div>

	</div>


	<script src="https://unpkg.com/vue@3"></script>
	<script src="https://unpkg.com/vue-router@4"></script>
	<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/embla-carousel@8/embla-carousel.umd.js"></script>
	<script src="app.js"></script>

</html>
